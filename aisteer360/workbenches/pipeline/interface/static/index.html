<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Steerability 360 — Pipeline Workbench</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common/common.css" />
<link rel="stylesheet" href="/canvas/pipeline-canvas.css" />
</head>
<body>

<nav class="topbar">
  <div class="brand">
    <img class="logo" src="/static/common/logo_darkmode.svg" alt="AI Steerability 360" />
    <span class="name"><span class="sub">Pipeline Workbench</span></span>
  </div>
  <div class="spacer"></div>
  <button class="icon-btn" id="themeToggle" title="Toggle light/dark mode" type="button">
    <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round"></svg>
  </button>
  <button class="icon-btn" id="btnHelp" title="How to use">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10"/>
      <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
      <line x1="12" y1="17" x2="12.01" y2="17"/>
    </svg>
  </button>
  <button class="icon-btn" id="btnSettings" title="Settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
</nav>

<div class="workspace">
  <div class="workspace-inset">
    <div id="pipeline-canvas-root"></div>
  </div>
</div>

<footer class="footer">
  <span id="fCopyright"></span>
  <span class="spacer"></span>
  <button class="status" id="statusBtn" title="Session status" type="button">
    <span id="statusDot" class="dot idle"></span>
    <span id="statusText">no session</span>
  </button>
</footer>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  // theme toggle
  const THEME_KEY = "aisteer360-theme";
  const SUN_ICON = '<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/>';
  const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/>';

  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    try { localStorage.setItem(THEME_KEY, theme); } catch (_) {}
    const logo = document.querySelector(".topbar .brand .logo");
    if (logo) {
      logo.src = theme === "light" ? "/static/common/logo_lightmode.svg" : "/static/common/logo_darkmode.svg";
    }
    const icon = $("themeIcon");
    if (icon) {
      icon.innerHTML = theme === "light" ? MOON_ICON : SUN_ICON;
    }
  }

  function initTheme() {
    let saved = "dark";
    try { saved = localStorage.getItem(THEME_KEY) || "dark"; } catch (_) {}
    applyTheme(saved === "light" ? "light" : "dark");
    const btn = $("themeToggle");
    if (btn) {
      btn.addEventListener("click", () => {
        const current = document.documentElement.getAttribute("data-theme") || "dark";
        applyTheme(current === "light" ? "dark" : "light");
      });
    }
  }

  // owner token: ?owner_token=… → localStorage; bail with a static message if missing.
  // The React canvas bundle reads localStorage["aisteer360-owner-token"] directly when it loads.
  const tokenKey = "aisteer360-owner-token";
  const params = new URLSearchParams(window.location.search);
  let ownerToken = params.get("owner_token");
  if (ownerToken) {
    try { localStorage.setItem(tokenKey, ownerToken); } catch (_) {}
    params.delete("owner_token");
    const newSearch = params.toString();
    window.history.replaceState({}, document.title,
      window.location.pathname + (newSearch ? "?" + newSearch : ""));
  } else {
    try { ownerToken = localStorage.getItem(tokenKey); } catch (_) {}
  }
  if (!ownerToken) {
    document.body.innerHTML =
      '<div style="padding:40px;font-family:monospace;color:#aaa">' +
      'Missing owner token. Reopen the dashboard via the URL printed by the server.' +
      '</div>';
    return;
  }

  // status pill
  function setStatus(state, label) {
    $("statusDot").className = "dot " + (state || "idle");
    $("statusText").textContent = label || state || "idle";
  }

  initTheme();
  $("fCopyright").textContent = `IBM Research, ${new Date().getFullYear()}`;
  setStatus("idle", "no session");

  // bridge the chrome's settings button + status pill to the React canvas via custom events
  const btnSettings = $("btnSettings");
  if (btnSettings) {
    btnSettings.addEventListener("click", () => {
      window.dispatchEvent(new CustomEvent("aisteer-open-session"));
    });
  }
  window.addEventListener("aisteer-status", (e) => {
    const detail = (e && e.detail) || {};
    setStatus(detail.state || "idle", detail.label || "");
  });

  // load the React canvas bundle. Owner token is in localStorage by this point.
  const script = document.createElement("script");
  script.src = "/canvas/pipeline-canvas.js";
  script.defer = true;
  document.body.appendChild(script);
})();
</script>

</body>
</html>
