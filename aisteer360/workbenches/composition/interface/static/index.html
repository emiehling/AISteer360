<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>AI Steerability 360 — Composition Workbench</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/common/common.css" />
<style>
  /* layout: preview area on top, drag divider, canvas panel on the bottom */
  .compose-split {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .preview-area {
    min-height: 80px;
    flex: 1 1 auto;
    overflow: auto;
    padding: 18px 22px;
    color: var(--text-soft);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .preview-area .preview-empty {
    margin: auto;
    text-align: center;
    color: var(--text-dimmer);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
  }
  .preview-area .preview-prompt {
    display: flex;
    gap: 8px;
    align-items: stretch;
  }
  .preview-area .preview-prompt textarea {
    flex: 1;
    min-height: 56px;
    background: var(--panel-2);
    border: 1px solid var(--line-2);
    border-radius: 2px;
    padding: 8px 10px;
    color: var(--text);
    font-family: var(--mono);
    font-size: 11.5px;
    resize: vertical;
    outline: none;
  }
  .preview-area .preview-prompt textarea:focus { border-color: var(--accent); }
  .preview-area .preview-output {
    background: var(--panel);
    border: 1px solid var(--line-2);
    border-radius: 2px;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 11.5px;
    color: var(--text);
    min-height: 80px;
    white-space: pre-wrap;
  }
  .preview-area .preview-output.empty { color: var(--text-dimmer); }

  .btn {
    background: var(--accent);
    color: var(--primary-text);
    font-family: var(--sans);
    font-weight: 600;
    font-size: 11.5px;
    letter-spacing: 0.02em;
    padding: 0 16px;
    height: 32px;
    border-radius: 2px;
    cursor: pointer;
    transition: background 0.12s;
  }
  .btn:hover { background: var(--accent-hov); }
  .btn:disabled {
    opacity: 0.45;
    cursor: not-allowed;
  }

  .divider-handle {
    flex: 0 0 6px;
    background: transparent;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    cursor: row-resize;
    position: relative;
    user-select: none;
  }
  .divider-handle::after {
    content: "";
    position: absolute;
    inset: 2px 50%;
    width: 32px;
    transform: translateX(-50%);
    border-radius: 2px;
    background: var(--line-2);
  }
  .divider-handle:hover::after { background: var(--text-dimmer); }

  .canvas-panel {
    min-height: 200px;
    flex: 0 0 auto;
    height: 45%;
    background: var(--panel);
    border-top: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .canvas-toolbar {
    height: 36px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    border-bottom: 1px solid var(--line);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  .canvas-surface {
    flex: 1;
    position: relative;
    overflow: auto;
    background:
      radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0),
      var(--panel);
    background-size: 18px 18px;
  }
  .canvas-empty {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text-dimmer);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    pointer-events: none;
  }

  .compose-status {
    margin-left: auto;
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--text-dim);
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <img class="logo" src="/static/common/logo_darkmode.svg" alt="AI Steerability 360" />
    <span class="name">AI Steerability 360</span>
    <span class="sep">·</span>
    <span class="sub">Composition Workbench</span>
  </div>
  <div class="spacer"></div>
  <button class="status" id="statusPill" title="Session status">
    <span class="dot idle" id="statusDot"></span>
    <span id="statusText">no session</span>
  </button>
  <button class="theme-toggle icon-btn" id="themeToggle" title="Toggle theme">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4l1.4-1.4M17 7l1.4-1.4"/></svg>
  </button>
</div>

<div class="workspace">
  <div class="workspace-inset">
    <div class="compose-split" id="composeSplit">
      <div class="preview-area" id="previewArea">
        <div class="preview-empty">No session — start one to test pipelines.</div>
      </div>
      <div class="divider-handle" id="dividerHandle" aria-label="Resize panels"></div>
      <div class="canvas-panel">
        <div class="canvas-toolbar">
          <span>Composition Canvas</span>
          <span class="compose-status" id="composeHash">no pipeline</span>
        </div>
        <div class="canvas-surface" id="canvasSurface">
          <div class="canvas-empty">Drop controls here to build a pipeline.</div>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="statusbar">
  <span><b>composition workbench</b></span>
  <span class="spacer"></span>
  <span id="footerSession"></span>
</div>

<script>
(function () {
  // ── theme toggle ──────────────────────────────────────
  const themeKey = "aisteer360-theme";
  const logo = document.querySelector(".topbar .brand .logo");
  function applyTheme(theme) {
    document.documentElement.setAttribute("data-theme", theme);
    if (logo) {
      logo.src = theme === "light" ? "/static/common/logo_lightmode.svg" : "/static/common/logo_darkmode.svg";
    }
    try { localStorage.setItem(themeKey, theme); } catch (_) {}
  }
  let stored = "dark";
  try { stored = localStorage.getItem(themeKey) || "dark"; } catch (_) {}
  applyTheme(stored);
  document.getElementById("themeToggle").addEventListener("click", () => {
    const cur = document.documentElement.getAttribute("data-theme") || "dark";
    applyTheme(cur === "dark" ? "light" : "dark");
  });

  // ── owner token ───────────────────────────────────────
  const tokenKey = "aisteer360-owner-token";
  const params = new URLSearchParams(window.location.search);
  let ownerToken = params.get("owner_token");
  if (ownerToken) {
    try { localStorage.setItem(tokenKey, ownerToken); } catch (_) {}
    params.delete("owner_token");
    const newSearch = params.toString();
    window.history.replaceState({}, document.title,
      window.location.pathname + (newSearch ? "?" + newSearch : ""));
  } else {
    try { ownerToken = localStorage.getItem(tokenKey); } catch (_) {}
  }
  if (!ownerToken) {
    document.body.innerHTML =
      '<div style="padding:40px;font-family:monospace;color:#aaa">' +
      'Missing owner token. Reopen the dashboard via the URL printed by the server.' +
      '</div>';
    return;
  }

  // ── divider drag-to-resize ────────────────────────────
  const splitKey = "aisteer360-compose-split";
  const handle = document.getElementById("dividerHandle");
  const split = document.getElementById("composeSplit");
  const canvasPanel = document.querySelector(".canvas-panel");

  let storedFraction = 0.45;
  try {
    const v = parseFloat(localStorage.getItem(splitKey));
    if (!Number.isNaN(v) && v > 0.1 && v < 0.9) storedFraction = v;
  } catch (_) {}
  function applyFraction(f) {
    const total = split.getBoundingClientRect().height;
    if (!total) return;
    const px = Math.max(120, Math.min(total - 120, total * f));
    canvasPanel.style.height = px + "px";
    canvasPanel.style.flex = "0 0 auto";
  }
  applyFraction(storedFraction);
  window.addEventListener("resize", () => applyFraction(storedFraction));

  let dragging = false;
  handle.addEventListener("pointerdown", (e) => {
    dragging = true;
    handle.setPointerCapture(e.pointerId);
    document.body.style.cursor = "row-resize";
  });
  handle.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const rect = split.getBoundingClientRect();
    const fromBottom = rect.bottom - e.clientY;
    const fraction = Math.max(0.15, Math.min(0.85, fromBottom / rect.height));
    storedFraction = fraction;
    applyFraction(fraction);
  });
  handle.addEventListener("pointerup", (e) => {
    if (!dragging) return;
    dragging = false;
    handle.releasePointerCapture(e.pointerId);
    document.body.style.cursor = "";
    try { localStorage.setItem(splitKey, String(storedFraction)); } catch (_) {}
  });

  // ── status pill ───────────────────────────────────────
  const statusDot = document.getElementById("statusDot");
  const statusText = document.getElementById("statusText");
  function setStatus(state, label) {
    statusDot.className = "dot " + (state || "idle");
    statusText.textContent = label || state || "idle";
  }

  // ── future hooks ──────────────────────────────────────
  // The server is wired (POST /api/sessions, POST /api/sessions/{id}/infer,
  // /ws/sessions/{id}). The composition canvas + node palette + edge editor live
  // on top of the same fetch/WebSocket plumbing as the VC dashboard.
  setStatus("idle", "no session");
})();
</script>

</body>
</html>
