[project]
name            = "steerability"
version         = "0.5.0"
description     = "Steerability Toolkit"
readme          = "README.md"
license         = { text = "Apache-2.0" }
authors         = [{ name = "IBM Research" }]
maintainers     = [
    { name = "Erik Miehling", email = "erik.miehling@ibm.com" },
    { name = "Praveen Venkateswaran", email = "praveen.venkateswaran@ibm.com" },
    { name = "Inge Vejsbjerg", email = "INGEVEJS@ie.ibm.com" }
]
keywords = [
    "language models",
    "steerability",
    "composite steering",
    "prompt engineering",
    "activation steering",
    "parameter-efficient fine-tuning",
    "decoding-time alignment"
]

classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
]

# core
dependencies = [
    "absl-py>=2.2.2,<3.0.0",
    "accelerate>=1.4.0,<2.0.0",
    "datasets>=4.7.0,<6.0.0",
    "einops>=0.7.0,<1.0.0",
    "immutabledict>=4.2.1,<5.0.0",
    "langdetect==1.0.9",
    "nltk>=3.9.1,<4.0.0",
    "numpy>=1.17.0",
    "pandas>=2.2.3,<3.0.0",
    "peft>=0.20.0,<0.21.0",
    "python-dotenv>=1.0.1,<2.0.0",
    "scikit-learn>=1.6.1,<2.0.0",
    "torch>=2.5.1,<3.0.0",
    "transformers>=5.0.0,<6.0.0",
    "tqdm>=4.66.5,<5.0.0",
    "trl>=1.0.0,<2.0.0",
]

# optional groups
[project.optional-dependencies]
# `merging` installs mergekit from a pinned main commit (0.1.4 on PyPI never calls `model_rebuild()` on
# its torch-typed pydantic models and fails at merge time).
# Additionally note that `merging` cannot share an environment with `inspect` since mergekit pins
# pydantic~=2.10 and fails to import under the pydantic>=2.13 (required by inspect-ai) so it stays out of `all`
merging = [
    "mergekit @ git+https://github.com/arcee-ai/mergekit.git@a6e402884ba9bc30da7f23e8304a35f19485de95",
]
cpo = [
    "econml>=0.16.0,<0.17.0",
]
inspect = [
    "inspect-ai>=0.3.260,<0.4.0",
    "inspect-evals>=0.18.0,<1.0.0",
]
guided = [
    "xgrammar>=0.1.19",
]
viz = [
    "matplotlib>=3.8.0,<4.0.0",
    "seaborn>=0.13.0,<0.14.0",
]
vllm = [
    "vllm>=0.26.0,<1.0.0",
    "trl[vllm]",
    # "vllm-hook-plugins @ git+https://github.com/IBM/vLLM-Hook.git@steerability-challenge#subdirectory=vllm_hook_plugins",
    "vllm-hook-plugins @ git+https://github.com/emiehling/vLLM-Hook.git@steerability-interface#subdirectory=vllm_hook_plugins",
]
all = [
    "steerability[cpo,inspect,viz]",
]
docs = [
    "steerability[all]",
    "mkdocs-material",
    "mkdocs-jupyter",
    "mkdocs-click",
    "mkdocs-include",
    "mkdocstrings[python]",
    "griffe_inherited_docstrings",
    "griffe-pydantic",
    "mkdocs-awesome-nav",
    "mkdocs-include-markdown-plugin",
    "mkdocs-bibtex",
]

dev = [
    "steerability[all]",
    # "vllm-hook-plugins @ git+https://github.com/IBM/vLLM-Hook.git@steerability-challenge#subdirectory=vllm_hook_plugins",
    "vllm-hook-plugins @ git+https://github.com/emiehling/vLLM-Hook.git@steerability-interface#subdirectory=vllm_hook_plugins",
    "notebook>=7.4.5",
    "ipywidgets>=8.1.0,<9.0.0",
    "pytest>=8.3.2,<9.0.0",
    "pre-commit>=4.3.0",
]

# tools
[tool.uv]
# mergekit pins pydantic~=2.10 and cannot import under the pydantic>=2.13 that inspect-ai
# requires, so `merging` never co-installs with `inspect` or the extras that include it;
# mergekit's safetensors pin (~=0.5) likewise conflicts with vllm's (>=0.6.2)
conflicts = [
    [{ extra = "merging" }, { extra = "inspect" }],
    [{ extra = "merging" }, { extra = "all" }],
    [{ extra = "merging" }, { extra = "dev" }],
    [{ extra = "merging" }, { extra = "docs" }],
    [{ extra = "merging" }, { extra = "vllm" }],
]

[tool.uv.build-backend]
module-root = ""
module-name = "steerability"

[tool.isort]
profile = "black"
line_length = 120
extend_skip = [".claude"]

# build
[build-system]
requires = ["uv_build>=0.8.9,<0.9.0"]
build-backend = "uv_build"
